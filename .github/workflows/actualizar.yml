name: Actualizar app (lunes 9:00)

on:
  schedule:
    # GitHub usa hora UTC. Hay dos avisos para cubrir el horario de invierno y el de verano;
    # el paso "Comprobar hora" solo deja pasar la ejecución que cae a partir de las 9:00 en España.
    - cron: "0 7 * * 1"
    - cron: "0 8 * * 1"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-app
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Comprobar hora
        id: hora
        run: |
          H=$((10#$(TZ=Europe/Madrid date +%H)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" -ge 9 ] && [ "$H" -le 11 ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Aún no son las 9:00 en España; se omite esta ejecución."
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Leer wanafutbol y regenerar la app
        if: steps.hora.outputs.ok == 'true'
        run: python -u actualizar.py

      - name: Guardar cambios
        if: steps.hora.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Sin cambios: la app ya estaba al día."
            exit 0
          fi
          git config user.name "actualizador-s10e"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Actualización automática de resultados y clasificación"
          git push
          # Por si GitHub Pages no se republica solo tras este cambio:
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
