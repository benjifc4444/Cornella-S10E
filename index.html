var home=r[0]===ME,sc=r[2]===null?(r[5]?"Aplazado":"—"):(home?r[2]+" - "+r[3]:r[3]+" - "+r[2]);
h+='<tr><td>'+j+'</td><td class="t">'+tm(home?r[1]:r[0])+'</td><td>'+(home?"Local":"Visitante")+'</td><td>'+r[4]+'</td><td>'+sc+'</td></tr>'}
return h+'</tbody></table></div><p class="note">Resultado con los goles de la S10E primero.</p>'}
function viewP(){
  var js=Object.keys(J).sort(function(a,b){return a-b});
  var d=J[pj]||J[js[js.length-1]],h=nextE()+'<div class="row2"><label>Jornada<select data-act="pj">'+js.map(function(j){return'<option'+(+j===+pj?" selected":"")+'>'+j+'</option>'}).join("")+'</select></label></div><h2>Partidos de la jornada '+pj+'</h2>';
  d.res.forEach(function(r){var me=r[0]===ME||r[1]===ME,sc=r[2]===null?(r[5]?"Aplazado":"—"):r[2]+" - "+r[3];
    h+='<div class="m'+(me?" me":"")+'"><div class="h'+(r[2]!==null&&r[2]>r[3]?" w":"")+'">'+tm(r[0],1)+'</div><div class="sc" title="'+r[4]+'">'+sc+'</div><div class="'+(r[2]!==null&&r[3]>r[2]?"w":"")+'">'+tm(r[1])+'</div></div>'});
  h+='<p class="note">Descansa: '+esc(d.rest)+'. Fecha y hora de cada partido al pasar el ratón sobre el marcador.</p>';
  var rows=T.slice();
  h+='<h2>Clasificación tras la jornada '+CLAS_J+'</h2><div class="wrap"><table><thead><tr><th>#</th><th class="t">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Últimos 5</th></tr></thead><tbody>';
  rows.forEach(function(t,i){var dg=t[5]-t[6];h+='<tr class="'+(t[0]===ME?"me":"")+'"><td>'+(i+1)+'</td><td class="t">'+tm(t[0])+'</td><td class="pts">'+(t[2]*3+t[3])+'</td><td>'+t[1]+'</td><td>'+t[2]+'</td><td>'+t[3]+'</td><td>'+t[4]+'</td><td>'+t[5]+'</td><td>'+t[6]+'</td><td>'+(dg>0?"+":"")+dg+'</td><td><span class="dots">'+dotsH(t[7])+'</span></td></tr>'});
  return h+'</tbody></table></div><p class="note">Último en la derecha. Los datos se actualizan cada lunes a las 10:00 pasando las capturas de la FCF.</p>'+calE()}

function convList(){return S.roster.filter(function(n){return S.draft.conv[n]}).sort(function(a,b){return a.localeCompare(b,"es")})}
function opts(list,cur,none){return'<option value="">'+none+'</option>'+list.map(function(n){return'<option'+(n===cur?" selected":"")+' value="'+esc(n)+'">'+esc(n)+'</option>'}).join("")}
function viewA(){
  var D=S.draft,cv=convList(),q=D.q[qi],h='';
  h+='<div class="card"><div class="row2"><label>Jornada<select data-act="jor">'+Object.keys(J).map(function(j){return'<option value="'+j+'"'+(+j===+D.jornada?" selected":"")+'>'+j+(saved(j)?" ✓":"")+'</option>'}).join("")+'</select></label><label>Rival<input type="text" data-act="riv" value="'+esc(D.rival)+'"></label></div><p class="note">✓ = jornada con alineación guardada. Al elegirla se carga para modificarla.</p></div>';
  h+='<h2>Jugadores convocados ('+cv.length+' de '+S.roster.length+')</h2><div class="row2" style="margin-bottom:8px"><button class="btn s" data-act="all">Marcar todos</button><button class="btn s" data-act="none">Desmarcar todos</button></div><div class="pl">'+S.roster.slice().sort(function(a,b){return a.localeCompare(b,"es")}).map(function(n){return'<label class="'+(D.conv[n]?"on":"")+'"><input type="checkbox" data-act="conv" data-n="'+esc(n)+'"'+(D.conv[n]?" checked":"")+'><span>'+esc(n)+'</span></label>'}).join("")+'</div>';
  h+='<div class="row2" style="margin-top:8px"><label>Añadir jugador<input type="text" id="np" placeholder="Nombre y apellidos"></label><button class="btn s" data-act="add">Añadir</button></div>';
  h+='<h2>Formación por cuartos</h2>'+banner(D)+'<div class="q">'+[0,1,2,3].map(function(i){return'<button data-q="'+i+'" class="'+(i===qi?"on":"")+'">Cuarto '+(i+1)+'</button>'}).join("")+'</div>';
  h+='<div class="row2"><label>Formación<select data-act="form">'+Object.keys(F).map(function(f){return'<option'+(f===q.f?" selected":"")+'>'+f+'</option>'}).join("")+'</select></label>'+(qi>0?'<button class="btn s" data-act="copy">Copiar del cuarto anterior</button>':'')+'</div>';
  var rows=F[q.f],idx=0,rh=[];
  rows.forEach(function(n,ri){var r='<div class="pr'+(n===1?" one":n===4?" four":"")+'">';for(var k=0;k<n;k++){var i=idx++,used=q.s.filter(function(x,j){return j!==i&&x});
    r+='<select data-act="slot" data-i="'+i+'" aria-label="'+(ri===0?"Portero":"Jugador "+(i+1))+'">'+opts(cv.filter(function(x){return used.indexOf(x)<0}),q.s[i],ri===0?"Portero":"Elegir")+'</select>'}rh.push(r+'</div>')});
  h+='<div class="pitch">'+rh.reverse().join("")+'</div>';
  if(!cv.length)h+='<p class="note">Marca primero los jugadores convocados: solo ellos aparecen en los desplegables.</p>';
  if(qi===3){var inQ=q.s.filter(Boolean),bench=cv.filter(function(x){return inQ.indexOf(x)<0});
    h+='<h2>Cambios en el cuarto 4</h2><p class="note">Cada jugador implicado en un cambio suma 7 min 30 s y 0,5 partes.</p>';
    D.subs.forEach(function(s,k){var usedIn=D.subs.filter(function(x,j){return j!==k&&x.in}).map(function(x){return x.in}),usedOut=D.subs.filter(function(x,j){return j!==k&&x.out}).map(function(x){return x.out});
      h+='<div class="sub"><select data-act="sout" data-k="'+k+'" aria-label="Sale">'+opts(inQ.filter(function(x){return usedOut.indexOf(x)<0}),s.out,"Sale")+'</select><select data-act="sin" data-k="'+k+'" aria-label="Entra">'+opts(bench.filter(function(x){return usedIn.indexOf(x)<0}),s.in,"Entra")+'</select><button class="btn d" data-act="rs" data-k="'+k+'">Quitar</button></div>'});
    h+='<button class="btn s" data-act="as">Añadir cambio</button>'}
  h+='<div class="row2" style="margin-top:16px"><button class="btn" data-act="save">Guardar alineación de la jornada '+D.jornada+'</button><button class="btn d" data-act="clear">Vaciar</button></div><p class="note"><span id="m1" class="'+(msg[0]==="!"?"err":"ok")+'">'+esc(msg.replace(/^!/,""))+'</span></p>';
  return h}

function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return m+":"+(s<10?"0":"")+s}
function calc(){var o={};S.roster.forEach(function(n){o[n]={c:0,s:0,p:0}});
  S.hist.forEach(function(e){var g=function(n){return o[n]||(o[n]={c:0,s:0,p:0})};
    e.conv.forEach(function(n){g(n).c++});
    e.q.forEach(function(q){q.s.forEach(function(n){if(n){g(n).s+=900;g(n).p+=1}})});
    (e.subs||[]).forEach(function(s){if(s.out&&s.in&&e.q[3].s.indexOf(s.out)>=0){g(s.out).s-=450;g(s.out).p-=.5;g(s.in).s+=450;g(s.in).p+=.5}})});
  return o}
function viewS(){var o=calc(),ns=Object.keys(o).sort(function(a,b){return o[b].s-o[a].s||a.localeCompare(b)});
  var h='<h2>Estadísticas por jugador</h2><p class="note">Calculadas con las '+S.hist.length+' alineaciones guardadas. Cuartos de 15 minutos.</p><div class="wrap"><table><thead><tr><th class="t">Jugador</th><th>Partidos convocado</th><th>Minutos jugados</th><th>Partes jugadas</th></tr></thead><tbody>';
  ns.forEach(function(n){h+='<tr><td class="t">'+esc(n)+'</td><td>'+o[n].c+'</td><td>'+fmt(o[n].s)+'</td><td>'+String(o[n].p).replace(".",",")+'</td></tr>'});
  return h+'</tbody></table></div><p class="note">Minutos en formato min:s.</p>'+charts(o,ns)+viewQ()}
function bars(it){var mx=Math.max.apply(null,it.map(function(x){return x.v}).concat([1]));return it.map(function(x){return'<div class="br"><span class="bn" title="'+esc(x.n)+'">'+esc(x.n)+'</span><span class="bt"><i style="width:'+Math.round(x.v/mx*100)+'%"></i></span><span class="bv">'+x.t+'</span></div>'}).join("")}
function charts(o,ns){var by=function(k){return ns.slice().sort(function(a,b){return o[b][k]-o[a][k]||a.localeCompare(b)})};
  return'<h2>Gráficas</h2><div class="card"><b>Minutos jugados</b>'+bars(by("s").map(function(n){return{n:n,v:o[n].s,t:fmt(o[n].s)}}))+'</div>'
   +'<div class="card"><b>Partidos convocado</b>'+bars(by("c").map(function(n){return{n:n,v:o[n].c,t:o[n].c}}))+'</div>'
   +'<div class="card"><b>Partes jugadas</b>'+bars(by("p").map(function(n){return{n:n,v:Math.max(o[n].p,0),t:String(o[n].p).replace(".",",")}}))+'</div>'}
function viewQ(){var m=[{},{},{},{}];m.forEach(function(o){S.roster.forEach(function(n){o[n]={c:0,s:0}})});
  S.hist.forEach(function(e){e.q.forEach(function(q,i){q.s.forEach(function(n){if(n){var o=m[i][n]||(m[i][n]={c:0,s:0});o.c++;o.s+=900}})});
    (e.subs||[]).forEach(function(x){if(x.out&&x.in&&e.q[3].s.indexOf(x.out)>=0){m[3][x.out].s-=450;var o=m[3][x.in]||(m[3][x.in]={c:0,s:0});o.c++;o.s+=450}})});
  var h='<h2>Quién juega más en cada cuarto</h2><div class="g4">';
  m.forEach(function(o,i){var ns=Object.keys(o).sort(function(a,b){return o[b].s-o[a].s||o[b].c-o[a].c||a.localeCompare(b)});
    h+='<div class="card"><b>Cuarto '+(i+1)+'</b>'+(ns.length?bars(ns.map(function(n){return{n:n,v:o[n].s,t:fmt(o[n].s)+" · "+o[n].c+(o[n].c===1?" vez":" veces")}})):'<p class="note">Sin datos todavía.</p>')+'</div>'});
  return h+'</div><p class="note">Se muestran todos los jugadores, con sus minutos y las veces que han jugado ese cuarto, según las alineaciones guardadas.</p>'}

function impexp(){return'<div class="row2" style="margin-bottom:6px"><button class="btn s" data-act="exp">Descargar copia</button><label class="btn s" style="cursor:pointer">Cargar copia<input type="file" accept=".json,application/json" data-act="imp" hidden></label></div><p class="note">La copia guarda las alineaciones. Sirve para pasarlas a otro móvil o recuperarlas.</p>'}
function viewH(){return impexp()+viewH0()}
function viewH0(){if(!S.hist.length)return'<h2>Alineaciones guardadas</h2><p class="note">Todavía no hay ninguna. Guarda una desde la pestaña Alineación.</p>';
  var h='<h2>Alineaciones guardadas</h2>';
  S.hist.slice().sort(function(a,b){return b.jornada-a.jornada}).forEach(function(e){
    h+='<div class="card"><b>Jornada '+e.jornada+'</b> · vs '+esc(e.rival||"—")+'<details><summary>Ver alineación</summary><p class="note">Convocados ('+e.conv.length+'): '+esc(e.conv.join(", "))+'</p>'
    +e.q.map(function(q,i){return'<p><b>Cuarto '+(i+1)+'</b> ('+q.f+'): '+esc(q.s.join(", "))+'</p>'}).join("")
    +((e.subs||[]).length?'<p><b>Cambios C4:</b> '+e.subs.map(function(s){return esc(s.out)+' → '+esc(s.in)}).join("; ")+'</p>':"")
    +'</details><button class="btn s" style="margin:6px 6px 0 0" data-act="edit" data-jn="'+e.jornada+'">Editar</button><button class="btn d" style="margin-top:6px" data-act="del" data-j="'+e.id+'">Eliminar</button></div>'});
  return h}

function viewHome(){var it=[["p","Partidos y clasificación","Jornadas, resultados y tabla",'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'],["a","Alineación","Convocatoria y cuartos",'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 9h3v6H3M21 9h-3v6h3"/><circle cx="12" cy="12" r="3"/>'],["s","Estadísticas","Minutos y partes jugadas",'<rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="8" width="4" height="12" rx="1"/>'],["h","Historial","Alineaciones guardadas",'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>']];
  return nextE()+'<div class="home">'+it.map(function(x){return'<button class="hb" data-t="'+x[0]+'"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+x[3]+'</svg></span><span>'+x[1]+'<small>'+x[2]+'</small></span></button>'}).join("")+'</div>'}
function render(){tabs();$("v").innerHTML=tab==="home"?viewHome():tab==="p"?viewP():tab==="a"?viewA():tab==="s"?viewS():viewH()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){tab=b.dataset.t;msg="";render();return}
  if(b.dataset.q){qi=+b.dataset.q;render();return}
  var a=b.dataset.act,D=S.draft;if(!a)return;
  if(a==="add"){var v=$("np").value.trim();if(v&&S.roster.indexOf(v)<0){S.roster.push(v);D.conv[v]=true;persist()}render()}
  if(a==="all"){S.roster.forEach(function(n){D.conv[n]=true});persist();render()}
  if(a==="none"){D.conv={};D.q.forEach(function(q){q.s=q.s.map(function(){return""})});D.subs=[];persist();render()}
  if(a==="exp"){var bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="alineaciones-s10e.json";document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
  if(a==="copy"){D.q[qi]=JSON.parse(JSON.stringify(D.q[qi-1]));persist();render()}
  if(a==="as"){D.subs.push({out:"",in:""});persist();render()}
  if(a==="rs"){D.subs.splice(+b.dataset.k,1);persist();render()}
  if(a==="clear"){if(confirm("¿Vaciar la alineación en curso?")){S.draft=blank();msg="";persist();render()}}
  if(a==="edit"){loadJ(+b.dataset.jn);tab="a";msg="";persist();render()}
  if(a==="del"){if(confirm("¿Eliminar esta alineación guardada?")){S.hist=S.hist.filter(function(x){return String(x.id)!==b.dataset.j});persist();render()}}
  if(a==="save"){var err="";if(!convList().length)err="Marca los convocados.";
    var inc=[];D.q.forEach(function(q,i){if(q.s.filter(Boolean).length<7)inc.push(i+1)});
    var subs=D.subs.filter(function(s){return s.out&&s.in});
    if(!err&&subs.length!==D.subs.length)err="Hay cambios sin completar en el cuarto 4.";
    if(err){msg="!"+err;render();return}
    if(inc.length&&!confirm("Faltan jugadores en el cuarto "+inc.join(", ")+". Solo contarán los minutos de los jugadores elegidos. ¿Guardar igualmente?"))return;
    var ent=JSON.parse(JSON.stringify(D));ent.conv=convList();ent.subs=subs;ent.id=Date.now();
    S.hist=S.hist.filter(function(x){return +x.jornada!==+D.jornada});S.hist.push(ent);
    msg="Alineación de la jornada "+D.jornada+" guardada.";persist();render()}
});
document.addEventListener("change",function(e){var t=e.target,a=t.dataset.act,D=S.draft;if(!a)return;
  if(a==="imp"){var f=t.files&&t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d||!Array.isArray(d.hist))throw 0;if(!confirm("Se sustituirán las alineaciones guardadas por las del archivo. ¿Continuar?"))return;S=d;fixS();persist();render()}catch(x){alert("El archivo no es una copia válida.")}};rd.readAsText(f);t.value="";return}
  if(a==="pj"){pj=+t.value;render();return}
  if(a==="jor"){loadJ(+t.value);persist();render()}
  if(a==="riv"){D.rival=t.value;persist()}
  if(a==="conv"){var n=t.dataset.n;D.conv[n]=t.checked;if(!t.checked){D.q.forEach(function(q){q.s=q.s.map(function(x){return x===n?"":x})});D.subs.forEach(function(s){if(s.out===n)s.out="";if(s.in===n)s.in=""})}persist();render()}
  if(a==="form"){D.q[qi].f=t.value;persist();render()}
  if(a==="slot"){D.q[qi].s[+t.dataset.i]=t.value;if(qi===3)D.subs.forEach(function(s){if(s.out&&D.q[3].s.indexOf(s.out)<0)s.out="";if(s.in&&D.q[3].s.indexOf(s.in)>=0)s.in=""});persist();render()}
  if(a==="sout"){D.subs[+t.dataset.k].out=t.value;persist()}
  if(a==="sin"){D.subs[+t.dataset.k].in=t.value;persist()}
});
$("hdc").src=CR[NM.E];
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
